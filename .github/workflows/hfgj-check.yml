name: HFGJ distribution checks
on:
  workflow_dispatch:
  pull_request:
    branches: [hfgj]
  push:
    branches: [hfgj]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build pinned OpenWrt signature verifier
        run: bash hfgj/scripts/setup-usign.sh
      - name: Build router-version opkg for offline integration tests
        run: bash hfgj/scripts/setup-opkg.sh
      - run: |
          python3 -m unittest discover -s hfgj/tests -v
          for script in feed.sh install.sh migrate.sh migrate-job.sh rollback-package.sh; do sh -n "$script" || exit; done
          bash -n hfgj/scripts/sync-upstream.sh hfgj/scripts/setup-opkg.sh
