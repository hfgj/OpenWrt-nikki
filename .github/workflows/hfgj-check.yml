name: HFGJ distribution checks
on:
  workflow_dispatch:
  pull_request:
    branches: [hfgj]
  push:
    branches: [hfgj]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build pinned OpenWrt signature verifier
        run: bash hfgj/scripts/setup-usign.sh
      - run: |
          python3 -m unittest discover -s hfgj/tests -v
          sh -n feed.sh install.sh migrate.sh
          bash -n hfgj/scripts/sync-upstream.sh
