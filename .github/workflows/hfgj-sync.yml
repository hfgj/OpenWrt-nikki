name: HFGJ upstream Nikki sync
on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: hfgj-nikki-upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'hfgj/OpenWrt-nikki' && vars.HFGJ_AUTO_SYNC == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hfgj
          fetch-depth: 0
      - name: Build pinned OpenWrt signature verifier
        run: bash hfgj/scripts/setup-usign.sh
      - name: Build router-version opkg for offline integration tests
        run: bash hfgj/scripts/setup-opkg.sh
      - name: Fetch official Nikki and preserve the distribution patch
        run: |
          git remote add upstream https://github.com/nikkinikki-org/OpenWrt-nikki.git
          bash hfgj/scripts/sync-upstream.sh
      - name: Explicitly dispatch the feed workflow after the token-authored push
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hfgj-feed.yml --ref hfgj
